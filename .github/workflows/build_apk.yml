name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer and Cython
        run: |
          pip install buildozer cython==0.29.36

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evoscanner-apk
          path: bin/*.apk
          retention-days: 30
