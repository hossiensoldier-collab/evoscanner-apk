name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:2024.01.21
    steps:
      - uses: actions/checkout@v4
      - run: yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: evoscanner-apk
          path: bin/*.apk
